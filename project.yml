# XcodeGen spec for CorckieApp (ARCHITECTURE §1, §6). The Xcode project is
# generated on the cloud Mac, so no Mac is needed here and no .xcodeproj is in git.
# One bundle ID for every build, forever (D02 rule: a new ID = a new, empty app).
name: CorckieApp
options:
  bundleIdPrefix: com.corckieapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"          # milestone: 0.4 = P4 foundation build, 0.5 = M1 Riding, 0.6 = M2 Routes … 1.0 = v1 (frozen at T-02)
    CURRENT_PROJECT_VERSION: "1"      # CI passes the run number (ARCHITECTURE §1.3)
    SWIFT_VERSION: "5.0"              # Swift 6 toolchain, Swift 5 language mode (§1.1)
    TARGETED_DEVICE_FAMILY: "1"
packages:
  CorckieCore:
    path: CorckieCore
  GRDB:                               # the only outside library (ARCHITECTURE §6.2); pinned
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
targets:
  CorckieApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Config/Info.plist"
      - path: Shared                       # F-31: the Live Activity attributes, also compiled into the widget extension
      - path: CorckieCore/Tests/Fixtures   # anonymised rides for the in-app simulator (TESTING §5)
        type: folder
        buildPhase: resources
    dependencies:
      - target: CorckieWidgets            # F-31: Live Activity (lock screen + Dynamic Island), embedded in the app
      - package: CorckieCore
        product: CorckieCore
      - package: CorckieCore
        product: CorckieSim
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: CorckieApp
        PRODUCT_BUNDLE_IDENTIFIER: com.corckieapp.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # F-15: the brand orange replaces the iOS blue (alerts, system controls)
        INFOPLIST_KEY_CFBundleDisplayName: CorckieApp   # owner, P4 D3: "v1" shows inside the app instead (VersionLabel)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"   # F-28: landscape only where OrientationLock allows it
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: CorckieApp reads live data from your scooter. It never changes the scooter's settings.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: CorckieApp records where you ride, for maps and routes.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: CorckieApp keeps recording your ride when the phone is locked in your pocket.
        INFOPLIST_KEY_NSMotionUsageDescription: CorckieApp measures climbs with the phone's barometer.
  CorckieWidgets:
    # F-31: the charge Live Activity. ActivityKit local updates only (no push, no server). Unsigned like the app; SideStore signs it on the phone.
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: CorckieApp Charging
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corckieapp.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  AppTests:
    # Migration tests (TESTING §1 layer 4). Store/ is compiled straight in: no app host,
    # so no Bluetooth / location side effects on the Simulator.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
      - path: App/Store
      - path: App/Recorder                 # M1-09: the Recorder actor records into a temporary database
      - path: App/Routes                   # M2-01: route processing (places, routes, variants) on a temporary database
      - path: CorckieCore/Tests/Fixtures   # rides 1 and 2 for the Recorder end-to-end test
        type: folder
        buildPhase: resources
    dependencies:
      - package: GRDB
      - package: CorckieCore
        product: CorckieCore
      - package: CorckieCore
        product: CorckieSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corckieapp.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CorckieApp:
    build:
      targets:
        CorckieApp: all
    run:
      config: Debug
    archive:
      config: Release
  AppTests:
    build:
      targets:
        AppTests: [test]
    test:
      config: Debug
      targets:
        - AppTests
