name: Build unsigned IPA

# Builds take ~30 s, so every push to main builds (~400 builds fit the free
# macOS minutes); the manual trigger stays for re-runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned; SideStore signs on the phone)
        run: |
          xcodebuild \
            -project Hello.xcodeproj \
            -scheme Hello \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hello.app Payload/
          zip -qr Hello.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hello-ipa
          path: Hello.ipa
          retention-days: 14
