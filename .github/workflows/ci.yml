name: CI

# F01: build-ipa only. F03 adds core-tests (Linux) in front of it, app-tests and ui-shots.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test (CorckieCore, Linux)
        working-directory: CorckieCore
        run: swift test --parallel

  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned; SideStore signs on the phone)
        run: |
          xcodebuild \
            -project CorckieApp.xcodeproj \
            -scheme CorckieApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        id: ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/CorckieApp.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          NAME="CorckieApp-$VERSION-${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIcons' "$APP/Info.plist"
          ls "$APP" | grep -i icon
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "$NAME.ipa" Payload
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.name }}.ipa
          retention-days: 14
